name: Feature request
description: Suggest an idea or improvement for one of Luka's mods.
title: "[Mod] "
labels: [enhancement]
body:
  - type: input
    id: mod
    attributes:
      label: Mod
      placeholder: InventoryManager
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mod version
      placeholder: "1.0.0"
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like the mod to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: How do you play, and what would this make easier?
